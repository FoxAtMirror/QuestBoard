appId: com.foxatmirror.questboard
productName: QuestBoard
copyright: © 2026 Vlad
directories:
  output: release-new
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - build/tray.png
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: QuestBoard-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QuestBoard
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: QuestBoard-${version}-mac-${arch}.${ext}
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: QuestBoard-${version}-linux-${arch}.${ext}
